<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" role="img" aria-labelledby="hydraTitle hydraDesc">
<title id="hydraTitle">Hydra workflow</title>
<desc id="hydraDesc">Request to 3-5 independent heads, hydra-plan converges to a 5-field handoff, auth gate, hydra-work implements, hydra-verify checks with repair loop.</desc>
<rect x="0" y="0" width="800" height="220" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111111">Hydra: plan-converge-execute-verify</text>
<g font-family="sans-serif" font-size="13" text-anchor="middle">
<rect x="24" y="52" width="120" height="60" rx="8" fill="#eef6ff" stroke="#1f6feb"/>
<text x="84" y="76" fill="#111111">Request</text>
<text x="84" y="94" fill="#555555">issue / change</text>
<rect x="164" y="52" width="140" height="60" rx="8" fill="#eef6ff" stroke="#1f6feb"/>
<text x="234" y="76" fill="#111111">3-5 heads</text>
<text x="234" y="94" fill="#555555">independent</text>
<rect x="324" y="52" width="140" height="60" rx="8" fill="#fff8c5" stroke="#9a6700"/>
<text x="394" y="76" fill="#111111">hydra-plan</text>
<text x="394" y="94" fill="#555555">5-field handoff</text>
<rect x="484" y="52" width="130" height="60" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
<text x="549" y="76" fill="#111111">hydra-work</text>
<text x="549" y="94" fill="#555555">implements</text>
<rect x="634" y="52" width="140" height="60" rx="8" fill="#ffebe9" stroke="#cf222e"/>
<text x="704" y="76" fill="#111111">hydra-verify</text>
<text x="704" y="94" fill="#555555">checks</text>
</g>
<g stroke="#57606a" stroke-width="2" marker-end="url(#hydraArrow)">
<defs>
<marker id="hydraArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#57606a"/>
</marker>
</defs>
<line x1="144" y1="82" x2="164" y2="82"/>
<line x1="304" y1="82" x2="324" y2="82"/>
<line x1="464" y1="82" x2="484" y2="82"/>
<line x1="614" y1="82" x2="634" y2="82"/>
</g>
<text x="24" y="140" font-family="sans-serif" font-size="12" fill="#333333">Handoff: task / ordered steps / files / checks / authorized scope. Auth gate stops if incomplete.</text>
<text x="24" y="160" font-family="sans-serif" font-size="12" fill="#333333">Verify fail returns to work for repair. Planning never edits; verification never fixes source.</text>
<text x="24" y="190" font-family="sans-serif" font-size="11" fill="#57606a">Source: docs/assets/hydra-flow.mmd. Edit the .mmd first, then re-export this SVG.</text>
</svg>
